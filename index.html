<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>poisson disc sampling</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="stage">
      <header class="hud" id="controls">
        <div class="sliders">
          <label class="control">
            <abbr title="Minimum distance">r</abbr>
            <input id="radius" type="range" min="4" max="32" value="12" />
            <strong id="val-r">12</strong>
          </label>
          <label class="control">
            <abbr title="Steps per frame">spd</abbr>
            <input id="speed" type="range" min="1" max="60" value="10" />
            <strong id="val-spd">10</strong>
          </label>
        </div>

        <div class="divider"></div>

        <div class="metrics" id="stats" aria-live="polite">
          <span
            ><abbr title="Points / theoretical max">pts</abbr>
            <strong id="val-pts">0 / 0</strong></span
          >
          <span><abbr title="Minimum distance">min</abbr> <strong id="val-min">—</strong></span>
        </div>

        <div class="divider"></div>

        <div class="actions" id="actions">
          <button
            class="icon-btn"
            id="toggle-play"
            aria-label="Pause simulation"
            data-state="playing"
          >
            <svg class="icon icon-pause" viewBox="0 0 16 16" fill="none">
              <rect x="4" y="3" width="2.5" height="10" rx="1" fill="currentColor" />
              <rect x="9.5" y="3" width="2.5" height="10" rx="1" fill="currentColor" />
            </svg>
            <svg class="icon icon-play" viewBox="0 0 16 16" fill="none">
              <path
                d="M4.5 3.2C4.5 2.65 5.1 2.32 5.56 2.62L12.7 7.42C13.1 7.7 13.1 8.3 12.7 8.58L5.56 13.38C5.1 13.68 4.5 13.35 4.5 12.8V3.2Z"
                fill="currentColor"
              />
            </svg>
            <span class="tooltip" role="tooltip">Pause <kbd>Space</kbd></span>
          </button>

          <button class="icon-btn" id="restart" aria-label="Restart">
            <svg class="icon icon-default" viewBox="0 0 16 16" fill="none">
              <path
                d="M12.5 8A4.5 4.5 0 1 1 11.1 4.7M12.5 2.8V5.3H10"
                stroke="currentColor"
                stroke-width="1.3"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <svg class="icon icon-done" viewBox="0 0 16 16" fill="none">
              <path
                d="M3.5 8.5L6.5 11.5L12.5 4.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="tooltip" role="tooltip">Restart <kbd>R</kbd></span>
          </button>
        </div>
      </header>

      <div class="canvas-frame">
        <canvas id="canvas" width="800" height="600"></canvas>
      </div>
    </main>

    <script src="index.js"></script>
    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const radiusInput = document.getElementById("radius");
      const speedInput = document.getElementById("speed");
      const valR = document.getElementById("val-r");
      const valSpd = document.getElementById("val-spd");
      const valPts = document.getElementById("val-pts");
      const valMin = document.getElementById("val-min");
      const togglePlayBtn = document.getElementById("toggle-play");
      const toggleTooltip = togglePlayBtn.querySelector(".tooltip");
      const restartBtn = document.getElementById("restart");

      let sampler;
      let raf;
      let isPlaying = true;
      let steps = parseInt(speedInput.value, 10);
      let maxPts = 0;
      let drawn = 0;
      let minSq = Infinity;

      function updateStats() {
        const n = sampler.points.length;
        const minDist = Math.sqrt(minSq);
        const valid = minDist >= sampler.r - 1e-9;

        valPts.textContent = `${n} / ${maxPts}`;
        valMin.textContent = minDist === Infinity ? "—" : minDist.toFixed(2);
        valMin.classList.toggle("bad", !valid);
      }

      function render() {
        if (isPlaying) {
          for (let i = 0; i < steps && stepSampler(sampler); i++);
        }

        const { points } = sampler;
        if (drawn < points.length) {
          ctx.fillStyle = "#ededef";
          ctx.beginPath();
          for (; drawn < points.length; drawn++) {
            const p = points[drawn];
            const d = nearestSqDist(sampler, p);
            if (d < minSq) minSq = d;
            ctx.moveTo(p.x + 2, p.y);
            ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
          }
          ctx.fill();
        }

        updateStats();

        raf = isPlaying && sampler.active.length > 0 ? requestAnimationFrame(render) : null;
      }

      function reset() {
        if (raf) cancelAnimationFrame(raf);
        const r = parseInt(radiusInput.value, 10);
        valR.textContent = r;
        sampler = createSampler(canvas.width, canvas.height, r, 30);
        maxPts = theoreticalMaxPoints(sampler);
        drawn = 0;
        minSq = Infinity;

        ctx.fillStyle = "#0a0a0c";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        render();
      }

      function togglePlay(viaKeyboard = false) {
        isPlaying = !isPlaying;
        if (viaKeyboard) {
          togglePlayBtn.dataset.instant = "true";
          requestAnimationFrame(() => delete togglePlayBtn.dataset.instant);
        }
        togglePlayBtn.dataset.state = isPlaying ? "playing" : "paused";
        togglePlayBtn.setAttribute(
          "aria-label",
          isPlaying ? "Pause simulation" : "Resume simulation",
        );
        toggleTooltip.innerHTML = `${isPlaying ? "Pause" : "Play"} <kbd>Space</kbd>`;
        if (isPlaying && !raf && sampler.active.length > 0) render();
      }

      function flashConfirmState(btn) {
        clearTimeout(btn._confirmTimer);
        btn.dataset.confirmed = "true";
        btn._confirmTimer = setTimeout(() => delete btn.dataset.confirmed, 650);
      }

      radiusInput.addEventListener("input", reset);
      speedInput.addEventListener("input", () => {
        steps = parseInt(speedInput.value, 10);
        valSpd.textContent = speedInput.value;
      });
      togglePlayBtn.addEventListener("click", () => togglePlay(false));
      restartBtn.addEventListener("click", () => {
        reset();
        flashConfirmState(restartBtn);
      });

      window.addEventListener("keydown", (e) => {
        if (e.target.tagName === "INPUT") return;
        if (e.code === "Space") {
          e.preventDefault();
          togglePlay(true);
        } else if (e.key === "r" || e.key === "R") {
          reset();
          flashConfirmState(restartBtn);
        }
      });

      const actionsContainer = document.getElementById("actions");
      let tooltipWarmTimer = null;

      actionsContainer.addEventListener("pointerenter", () => clearTimeout(tooltipWarmTimer));
      actionsContainer.querySelectorAll(".icon-btn").forEach((btn) => {
        btn.addEventListener("pointerenter", () => {
          if (actionsContainer.dataset.warm === "true") {
            btn.dataset.instant = "true";
          } else {
            btn._warmTimeout = setTimeout(() => {
              actionsContainer.dataset.warm = "true";
            }, 320);
          }
        });
        btn.addEventListener("pointerleave", () => {
          clearTimeout(btn._warmTimeout);
          delete btn.dataset.instant;
        });
      });
      actionsContainer.addEventListener("pointerleave", () => {
        tooltipWarmTimer = setTimeout(() => delete actionsContainer.dataset.warm, 350);
      });

      reset();
    </script>
  </body>
</html>
